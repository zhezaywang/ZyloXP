<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PID servo control reference</title>
  <desc id="desc">A closed-loop PID controller drives a servo plant while an encoder returns position feedback. A response analyzer shows rise time, overshoot, and settling time.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#146f8f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#163849" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dcebf1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="#f6fbfd"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <rect x="46" y="38" width="1108" height="86" rx="8" fill="#174d61"/>
  <text x="78" y="79" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">PID Servo Control Bench</text>
  <text x="78" y="105" fill="#bfe8f4" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Closed-loop position control, bounded drive, and measured step response</text>

  <g filter="url(#shadow)">
    <rect x="64" y="170" width="718" height="360" rx="8" fill="#fff" stroke="#b8d4df" stroke-width="2"/>
    <rect x="812" y="170" width="324" height="360" rx="8" fill="#fff" stroke="#b8d4df" stroke-width="2"/>
  </g>

  <text x="92" y="208" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">CLOSED-LOOP SIGNAL PATH</text>

  <g>
    <circle cx="145" cy="307" r="48" fill="#eef8fb" stroke="#146f8f" stroke-width="3"/>
    <text x="145" y="299" fill="#173849" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">COMMAND</text>
    <text x="145" y="326" fill="#0d6f58" font-family="SFMono-Regular, Consolas, monospace" font-size="24" font-weight="800" text-anchor="middle">60°</text>
  </g>

  <line x1="193" y1="307" x2="258" y2="307" stroke="#146f8f" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="223" cy="307" r="17" fill="#fff" stroke="#173849" stroke-width="3"/>
  <text x="223" y="302" fill="#173849" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle">+</text>
  <text x="223" y="324" fill="#d34d47" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle">−</text>

  <g>
    <rect x="272" y="244" width="178" height="126" rx="8" fill="#dcebf0" stroke="#173849" stroke-width="3"/>
    <rect x="290" y="266" width="142" height="76" rx="6" fill="#153a45" stroke="#071f29" stroke-width="2"/>
    <text x="361" y="289" fill="#9bd9e8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">DIGITAL PID</text>
    <text x="304" y="319" fill="#8ac5d5" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">Kp</text>
    <text x="350" y="319" fill="#a9f0d7" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="800" text-anchor="end">1.60</text>
    <text x="368" y="319" fill="#8ac5d5" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">Ki</text>
    <text x="420" y="319" fill="#a9f0d7" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="800" text-anchor="end">0.60</text>
    <text x="306" y="357" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">Kd .35 s</text>
  </g>

  <line x1="450" y1="307" x2="510" y2="307" stroke="#146f8f" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="480" y="291" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" text-anchor="middle">DRIVE</text>

  <g>
    <rect x="526" y="228" width="192" height="158" rx="8" fill="#d5e2e6" stroke="#173849" stroke-width="3"/>
    <circle cx="622" cy="297" r="52" fill="#47636d" stroke="#173849" stroke-width="4"/>
    <circle cx="622" cy="297" r="12" fill="#dce8eb" stroke="#173849" stroke-width="3"/>
    <line x1="622" y1="297" x2="654" y2="257" stroke="#ffd269" stroke-width="7" stroke-linecap="round"/>
    <circle cx="654" cy="257" r="7" fill="#ffd269" stroke="#6c4c0c" stroke-width="2"/>
    <text x="622" y="367" fill="#173849" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" text-anchor="middle">SERVO PLANT</text>
  </g>

  <g>
    <rect x="526" y="422" width="192" height="62" rx="8" fill="#e8f1f3" stroke="#173849" stroke-width="3"/>
    <circle cx="558" cy="453" r="18" fill="#49636d" stroke="#173849" stroke-width="2"/>
    <path d="M558 433V442M558 464V473M538 453H547M569 453H578" stroke="#8ee4c9" stroke-width="3"/>
    <text x="590" y="448" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">ENCODER</text>
    <text x="590" y="469" fill="#0d6f58" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="800">59.3°</text>
  </g>

  <path d="M526 453H223V324" fill="none" stroke="#2a9dc2" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="357" y="474" fill="#2a7893" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle">POSITION FEEDBACK</text>

  <text x="838" y="208" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">STEP RESPONSE ANALYZER</text>
  <rect x="838" y="232" width="272" height="204" rx="8" fill="#10333c" stroke="#071f29" stroke-width="3"/>
  <path d="M858 260V414M908 260V414M958 260V414M1008 260V414M1058 260V414M858 298H1090M858 336H1090M858 374H1090M858 414H1090" fill="none" stroke="#28525c" stroke-width="1"/>
  <rect x="858" y="275" width="232" height="18" rx="4" fill="#2c775f" opacity=".25"/>
  <line x1="858" y1="284" x2="1090" y2="284" stroke="#f0c84b" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M858 414C880 413 885 394 894 348C905 291 923 260 942 276C958 290 971 307 987 294C1002 282 1017 285 1034 286C1054 287 1071 286 1090 286" fill="none" stroke="#5bd8ed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="858" y="461" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">Rise time</text>
  <text x="948" y="461" fill="#173849" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">1.03 s</text>
  <text x="858" y="488" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">Overshoot</text>
  <text x="948" y="488" fill="#173849" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">4.5%</text>
  <text x="858" y="515" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">Settling</text>
  <text x="948" y="515" fill="#0d6f58" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">3.27 s</text>

  <g>
    <rect x="64" y="562" width="1072" height="112" rx="8" fill="#e8f7f3" stroke="#79c9b2" stroke-width="2"/>
    <text x="92" y="595" fill="#0f5f4d" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">GOVERNING RELATIONSHIPS</text>
    <text x="92" y="628" fill="#173849" font-family="SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">u(t) = Kp e(t) + Ki ∫e(t)dt + Kd de(t)/dt</text>
    <text x="690" y="628" fill="#173849" font-family="SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">ts ≈ 4 / (ζωn)</text>
    <text x="92" y="655" fill="#517080" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Tune one term at a time. Verify actuator limits, noise sensitivity, and recovery from saturation before release.</text>
  </g>
</svg>
