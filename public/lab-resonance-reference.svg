<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Series RLC resonance measurement reference</title>
  <desc id="description">A laboratory series resistor, inductor, and capacitor fixture connected to a sinusoidal source and swept-frequency network analyzer.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fafdff"/>
      <stop offset="1" stop-color="#eaf4f8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafb"/>
      <stop offset=".55" stop-color="#d8e4e8"/>
      <stop offset="1" stop-color="#9eb4bc"/>
    </linearGradient>
    <linearGradient id="resistor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c58d"/>
      <stop offset=".5" stop-color="#c69250"/>
      <stop offset="1" stop-color="#805128"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd18a"/>
      <stop offset=".45" stop-color="#c87120"/>
      <stop offset="1" stop-color="#784014"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#123e43"/>
      <stop offset="1" stop-color="#051f27"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#d9e9ef" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0a2c3b" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="22" fill="url(#background)"/>
  <rect width="1200" height="700" rx="22" fill="url(#grid)"/>
  <rect x="48" y="42" width="1104" height="88" rx="14" fill="#123b4d"/>
  <text x="82" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">RLC RESONANCE AND NETWORK ANALYZER</text>
  <text x="82" y="111" fill="#9de9d6" font-family="Arial, sans-serif" font-size="17">Series-current sweep · center frequency, Q, bandwidth, and phase</text>

  <g transform="translate(48 162)">
    <rect width="690" height="365" rx="18" fill="#f8fbfc" stroke="#aac5cf" stroke-width="3" filter="url(#shadow)"/>
    <rect x="14" y="14" width="662" height="337" rx="12" fill="#edf6f8" stroke="#d4e6eb" stroke-width="2"/>
    <circle cx="28" cy="28" r="6" fill="#8499a2"/>
    <circle cx="662" cy="28" r="6" fill="#8499a2"/>
    <text x="36" y="48" fill="#24485a" font-family="Arial, sans-serif" font-size="18" font-weight="700">SERIES RLC TEST FIXTURE</text>

    <circle cx="100" cy="190" r="54" fill="url(#panel)" stroke="#173e4e" stroke-width="6"/>
    <circle cx="100" cy="190" r="42" fill="#f5f9fa" stroke="#7894a0" stroke-width="2"/>
    <path d="M68 190c9-24 20-24 31 0s22 24 34 0" fill="none" stroke="#168bb7" stroke-width="6" stroke-linecap="round"/>
    <text x="100" y="267" text-anchor="middle" fill="#24485a" font-family="Arial, sans-serif" font-size="18" font-weight="700">AC SOURCE</text>
    <text x="100" y="291" text-anchor="middle" fill="#587181" font-family="Arial, sans-serif" font-size="16">5.0 V RMS</text>

    <path d="M100 136V112h104M340 112h38M510 112h52M591 112h44v165H100v-33" fill="none" stroke="#173e4e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="185" y1="112" x2="207" y2="112" stroke="#173e4e" stroke-width="8"/>
    <rect x="204" y="88" width="136" height="48" rx="23" fill="url(#resistor)" stroke="#67401e" stroke-width="3" filter="url(#shadow)"/>
    <line x1="232" y1="90" x2="232" y2="134" stroke="#6b381c" stroke-width="12"/>
    <line x1="258" y1="90" x2="258" y2="134" stroke="#c94131" stroke-width="12"/>
    <line x1="286" y1="90" x2="286" y2="134" stroke="#202628" stroke-width="12"/>
    <line x1="316" y1="90" x2="316" y2="134" stroke="#d6ad42" stroke-width="9"/>
    <text x="272" y="165" text-anchor="middle" fill="#24485a" font-family="Arial, sans-serif" font-size="19" font-weight="700">R = 12 Ω</text>

    <path d="M378 112c8-38 30-38 38 0s30 38 38 0 30-38 38 0 30 38 38 0" fill="none" stroke="url(#copper)" stroke-width="13" stroke-linecap="round" filter="url(#shadow)"/>
    <path d="M383 102c9-24 23-24 29 0m48 0c9-24 23-24 29 0" fill="none" stroke="#ffe1a8" stroke-width="3" stroke-linecap="round"/>
    <text x="454" y="165" text-anchor="middle" fill="#24485a" font-family="Arial, sans-serif" font-size="19" font-weight="700">L = 10 mH</text>

    <rect x="548" y="70" width="58" height="84" rx="8" fill="#2b7e92" stroke="#164b5b" stroke-width="4" filter="url(#shadow)"/>
    <line x1="562" y1="79" x2="562" y2="145" stroke="#d7f3f6" stroke-width="7"/>
    <line x1="591" y1="79" x2="591" y2="145" stroke="#d7f3f6" stroke-width="7"/>
    <text x="577" y="181" text-anchor="middle" fill="#24485a" font-family="Arial, sans-serif" font-size="19" font-weight="700">C = 2.50 µF</text>

    <path d="M100 136V112h535v165H100v-33" fill="none" stroke="#34b89a" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 18"/>
    <circle cx="100" cy="112" r="8" fill="#34b89a"/>
    <circle cx="635" cy="112" r="8" fill="#34b89a"/>

    <rect x="194" y="214" width="402" height="100" rx="12" fill="#dff6ef" stroke="#69bea6" stroke-width="3"/>
    <text x="218" y="246" fill="#186b5d" font-family="Arial, sans-serif" font-size="17" font-weight="700">OPERATING POINT</text>
    <text x="218" y="278" fill="#173e4e" font-family="Arial, sans-serif" font-size="25" font-weight="700">f₀ ≈ 1.007 kHz · Q ≈ 5.27</text>
    <text x="218" y="303" fill="#587181" font-family="Arial, sans-serif" font-size="16">At f₀: XL = XC, impedance is minimum, current is maximum.</text>
  </g>

  <g transform="translate(774 162)">
    <rect width="378" height="365" rx="18" fill="url(#panel)" stroke="#6f8994" stroke-width="3" filter="url(#shadow)"/>
    <rect x="14" y="14" width="350" height="337" rx="12" fill="#dce8eb" stroke="#f5fbfc" stroke-width="2"/>
    <text x="32" y="48" fill="#173e4e" font-family="Arial, sans-serif" font-size="18" font-weight="700">NETWORK / IMPEDANCE ANALYZER</text>
    <circle cx="335" cy="41" r="13" fill="#a7e8d4"/>
    <circle cx="335" cy="41" r="8" fill="#25b68f"/>

    <rect x="31" y="69" width="316" height="198" rx="9" fill="url(#screen)" stroke="#153947" stroke-width="4"/>
    <g stroke="#2d5d64" stroke-width="1">
      <path d="M54 90v150M121 90v150M189 90v150M256 90v150M324 90v150"/>
      <path d="M54 115h270M54 152h270M54 189h270M54 226h270"/>
    </g>
    <rect x="167" y="90" width="43" height="136" fill="#2ebc9b" opacity=".13"/>
    <path d="M54 220C90 216 120 200 150 152c15-24 27-55 39-60 12 5 24 36 39 60 30 48 60 64 96 68" fill="none" stroke="#8cf0d2" stroke-width="7" stroke-linecap="round"/>
    <path d="M189 92v134" stroke="#ffd062" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="187" cy="94" r="9" fill="#ffd062" stroke="#fff5c8" stroke-width="3"/>
    <text x="54" y="107" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13" font-weight="700">SERIES CURRENT</text>
    <text x="54" y="253" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13">250 Hz</text>
    <text x="324" y="253" text-anchor="end" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13">4.03 kHz</text>

    <text x="34" y="304" fill="#173e4e" font-family="Arial, sans-serif" font-size="17" font-weight="700">PEAK 0.417 A</text>
    <text x="344" y="304" text-anchor="end" fill="#173e4e" font-family="Arial, sans-serif" font-size="17" font-weight="700">BW 191 Hz</text>
    <path d="M138 337a51 51 0 0 1 102 0" fill="none" stroke="#6e8993" stroke-width="5" stroke-linecap="round"/>
    <line x1="189" y1="334" x2="189" y2="294" stroke="#f0b844" stroke-width="6" stroke-linecap="round"/>
    <circle cx="189" cy="334" r="7" fill="#173e4e"/>
    <text x="189" y="356" text-anchor="middle" fill="#173e4e" font-family="Arial, sans-serif" font-size="14" font-weight="700">PHASE 0°</text>
  </g>

  <g transform="translate(48 559)">
    <rect width="1104" height="99" rx="14" fill="#123b4d"/>
    <line x1="276" y1="18" x2="276" y2="81" stroke="#406373" stroke-width="2"/>
    <line x1="552" y1="18" x2="552" y2="81" stroke="#406373" stroke-width="2"/>
    <line x1="828" y1="18" x2="828" y2="81" stroke="#406373" stroke-width="2"/>
    <text x="24" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">CENTER FREQUENCY</text>
    <text x="24" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">f₀ = 1 / (2π√LC)</text>
    <text x="300" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">QUALITY FACTOR</text>
    <text x="300" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Q = (1/R)√(L/C)</text>
    <text x="576" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">BANDWIDTH</text>
    <text x="576" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">BW = f₀ / Q</text>
    <text x="852" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">SERIES IMPEDANCE</text>
    <text x="852" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">|Z| = √(R² + (XL−XC)²)</text>
  </g>
</svg>
