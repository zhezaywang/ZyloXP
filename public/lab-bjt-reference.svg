<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">BJT bias and semiconductor curve tracer reference</title>
  <desc id="description">A silicon NPN common-emitter bias fixture connected to a collector supply, current source, and semiconductor curve tracer displaying output curves and a DC load line.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fafdff"/>
      <stop offset="1" stop-color="#eaf4f8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f8f9"/>
      <stop offset=".5" stop-color="#d4e1e5"/>
      <stop offset="1" stop-color="#93abb4"/>
    </linearGradient>
    <linearGradient id="resistor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ebca95"/>
      <stop offset=".48" stop-color="#c78f4c"/>
      <stop offset="1" stop-color="#815328"/>
    </linearGradient>
    <linearGradient id="package" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#45555c"/>
      <stop offset=".42" stop-color="#202c31"/>
      <stop offset="1" stop-color="#081418"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#123e43"/>
      <stop offset="1" stop-color="#051f27"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#d9e9ef" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0a2c3b" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="22" fill="url(#background)"/>
  <rect width="1200" height="700" rx="22" fill="url(#grid)"/>
  <rect x="48" y="42" width="1104" height="88" rx="14" fill="#123b4d"/>
  <text x="82" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">BJT BIAS AND SEMICONDUCTOR CURVE TRACER</text>
  <text x="82" y="111" fill="#9de9d6" font-family="Arial, sans-serif" font-size="17">Common-emitter operating point · beta family, DC load line, and region check</text>

  <g transform="translate(48 162)">
    <rect width="690" height="365" rx="18" fill="#f8fbfc" stroke="#aac5cf" stroke-width="3" filter="url(#shadow)"/>
    <rect x="14" y="14" width="662" height="337" rx="12" fill="#eef7f4" stroke="#cee3de" stroke-width="2"/>
    <circle cx="28" cy="28" r="6" fill="#8499a2"/>
    <circle cx="662" cy="28" r="6" fill="#8499a2"/>
    <text x="36" y="48" fill="#24485a" font-family="Arial, sans-serif" font-size="18" font-weight="700">NPN COMMON-EMITTER TEST FIXTURE</text>
    <text x="650" y="48" text-anchor="end" fill="#167866" font-family="Arial, sans-serif" font-size="16" font-weight="700">FORWARD ACTIVE</text>

    <g transform="translate(34 76)">
      <rect width="158" height="100" rx="12" fill="url(#metal)" stroke="#315462" stroke-width="3" filter="url(#shadow)"/>
      <text x="79" y="25" text-anchor="middle" fill="#24485a" font-family="Arial, sans-serif" font-size="15" font-weight="700">COLLECTOR SUPPLY</text>
      <rect x="20" y="36" width="118" height="42" rx="7" fill="#c5d9b5" stroke="#19373f" stroke-width="3"/>
      <text x="79" y="65" text-anchor="middle" fill="#17382e" font-family="Consolas, monospace" font-size="24" font-weight="700">12.0 V</text>
      <circle cx="48" cy="90" r="8" fill="#df514c" stroke="#6d2420" stroke-width="3"/>
      <circle cx="110" cy="90" r="8" fill="#20333b" stroke="#0b171c" stroke-width="3"/>
    </g>

    <g transform="translate(34 220)">
      <rect width="198" height="94" rx="12" fill="#194a5a" stroke="#0c2d38" stroke-width="3" filter="url(#shadow)"/>
      <text x="99" y="24" text-anchor="middle" fill="#dff8f4" font-family="Arial, sans-serif" font-size="14" font-weight="700">PRECISION BASE DRIVE</text>
      <rect x="20" y="36" width="158" height="38" rx="7" fill="#c4d8b4" stroke="#0d2932" stroke-width="3"/>
      <text x="99" y="63" text-anchor="middle" fill="#17382e" font-family="Consolas, monospace" font-size="22" font-weight="700">20 µA</text>
    </g>

    <path d="M192 126h262V72" fill="none" stroke="#173e4e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="432" y="70" width="44" height="116" rx="20" fill="url(#resistor)" stroke="#67411f" stroke-width="3" filter="url(#shadow)"/>
    <line x1="434" x2="474" y1="94" y2="94" stroke="#6c361b" stroke-width="12"/>
    <line x1="434" x2="474" y1="120" y2="120" stroke="#c94131" stroke-width="12"/>
    <line x1="434" x2="474" y1="146" y2="146" stroke="#202628" stroke-width="12"/>
    <line x1="437" x2="471" y1="168" y2="168" stroke="#d6ad42" stroke-width="8"/>
    <text x="500" y="112" fill="#24485a" font-family="Arial, sans-serif" font-size="18" font-weight="700">RC</text>
    <text x="500" y="139" fill="#587181" font-family="Arial, sans-serif" font-size="18">2.2 kΩ</text>
    <path d="M454 186v26" fill="none" stroke="#173e4e" stroke-width="9" stroke-linecap="round"/>

    <circle cx="454" cy="248" r="71" fill="#f39a43" opacity=".14"/>
    <path d="M398 236q0-38 38-42h36q38 4 38 42v52q0 29-29 34h-54q-29-5-29-34z" fill="url(#package)" stroke="#071419" stroke-width="5" filter="url(#shadow)"/>
    <path d="M417 225q12-18 35-18" fill="none" stroke="#667a82" stroke-width="5" stroke-linecap="round"/>
    <text x="454" y="246" text-anchor="middle" fill="#eef6f7" font-family="Arial, sans-serif" font-size="19" font-weight="700">NPN</text>
    <text x="454" y="272" text-anchor="middle" fill="#9de9d6" font-family="Consolas, monospace" font-size="17">2N3904</text>
    <text x="454" y="297" text-anchor="middle" fill="#cfdee2" font-family="Arial, sans-serif" font-size="15">β ≈ 90</text>
    <line x1="430" x2="430" y1="322" y2="350" stroke="#a9b7bc" stroke-width="9"/>
    <line x1="454" x2="454" y1="322" y2="350" stroke="#a9b7bc" stroke-width="9"/>
    <line x1="478" x2="478" y1="322" y2="350" stroke="#a9b7bc" stroke-width="9"/>

    <path d="M232 267h126v-18h40" fill="none" stroke="#e1a535" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M478 338h126v-212h-2" fill="none" stroke="#173e4e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M192 126h262v64" fill="none" stroke="#32b794" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 18"/>
    <path d="M232 267h162" fill="none" stroke="#f0b845" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 18"/>
    <circle cx="454" cy="202" r="9" fill="#35b894" stroke="#176b5b" stroke-width="3"/>
    <circle cx="386" cy="249" r="9" fill="#f0b845" stroke="#8a5a10" stroke-width="3"/>

    <rect x="526" y="214" width="128" height="104" rx="12" fill="#dff6ef" stroke="#69bea6" stroke-width="3"/>
    <text x="590" y="240" text-anchor="middle" fill="#186b5d" font-family="Arial, sans-serif" font-size="14" font-weight="700">Q POINT</text>
    <text x="590" y="270" text-anchor="middle" fill="#173e4e" font-family="Consolas, monospace" font-size="20" font-weight="700">1.80 mA</text>
    <text x="590" y="295" text-anchor="middle" fill="#587181" font-family="Consolas, monospace" font-size="16">VCE 8.04 V</text>
  </g>

  <g transform="translate(774 162)">
    <rect width="378" height="365" rx="18" fill="url(#metal)" stroke="#6f8994" stroke-width="3" filter="url(#shadow)"/>
    <rect x="14" y="14" width="350" height="337" rx="12" fill="#dce8eb" stroke="#f5fbfc" stroke-width="2"/>
    <text x="30" y="48" fill="#173e4e" font-family="Arial, sans-serif" font-size="17" font-weight="700">SEMICONDUCTOR CURVE TRACER</text>
    <circle cx="335" cy="41" r="13" fill="#a7e8d4"/>
    <circle cx="335" cy="41" r="8" fill="#25b68f"/>

    <rect x="31" y="69" width="316" height="198" rx="9" fill="url(#screen)" stroke="#153947" stroke-width="4"/>
    <g stroke="#2d5d64" stroke-width="1">
      <path d="M54 90v150M121 90v150M189 90v150M256 90v150M324 90v150"/>
      <path d="M54 115h270M54 152h270M54 189h270M54 226h270"/>
    </g>
    <g fill="none" stroke="#52cbd3" stroke-width="4" opacity=".78">
      <path d="M54 226c9-26 18-30 35-30h235"/>
      <path d="M54 226c9-45 18-55 35-55h235"/>
      <path d="M54 226c9-64 18-80 35-80h235"/>
      <path d="M54 226c9-82 18-105 35-105h235"/>
      <path d="M54 226c9-99 18-128 35-128h235"/>
    </g>
    <path d="M54 93l270 133" fill="none" stroke="#f1c352" stroke-width="5" stroke-dasharray="10 8"/>
    <line x1="255" x2="255" y1="139" y2="240" stroke="#9de9d6" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="54" x2="255" y1="139" y2="139" stroke="#9de9d6" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="255" cy="139" r="10" fill="#ffca55" stroke="#fff3be" stroke-width="4"/>
    <text x="54" y="107" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13" font-weight="700">IC / VCE · IB STEPS</text>
    <text x="324" y="216" text-anchor="end" fill="#f1c352" font-family="Arial, sans-serif" font-size="13" font-weight="700">LOAD LINE</text>
    <text x="54" y="253" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13">0 V</text>
    <text x="324" y="253" text-anchor="end" fill="#87dbe7" font-family="Arial, sans-serif" font-size="13">12 V VCE</text>

    <text x="34" y="304" fill="#173e4e" font-family="Consolas, monospace" font-size="17" font-weight="700">IC 1.80 mA</text>
    <text x="344" y="304" text-anchor="end" fill="#173e4e" font-family="Consolas, monospace" font-size="17" font-weight="700">VCE 8.04 V</text>
    <rect x="34" y="319" width="310" height="31" rx="8" fill="#dff6ef" stroke="#3eae91" stroke-width="2"/>
    <text x="189" y="341" text-anchor="middle" fill="#167866" font-family="Arial, sans-serif" font-size="15" font-weight="700">FORWARD-ACTIVE REGION</text>
  </g>

  <g transform="translate(48 559)">
    <rect width="1104" height="99" rx="14" fill="#123b4d"/>
    <line x1="276" y1="18" x2="276" y2="81" stroke="#406373" stroke-width="2"/>
    <line x1="552" y1="18" x2="552" y2="81" stroke="#406373" stroke-width="2"/>
    <line x1="828" y1="18" x2="828" y2="81" stroke="#406373" stroke-width="2"/>
    <text x="24" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">FORWARD ACTIVE</text>
    <text x="24" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">IC ≈ βIB</text>
    <text x="300" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">COLLECTOR LOAD LINE</text>
    <text x="300" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">VCE = VCC − ICRC</text>
    <text x="576" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">SATURATION LIMIT</text>
    <text x="576" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">IC ≤ (VCC−VCE(sat))/RC</text>
    <text x="852" y="34" fill="#86d9e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">DEVICE DISSIPATION</text>
    <text x="852" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">PD = VCEIC</text>
  </g>
</svg>
