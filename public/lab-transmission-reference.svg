<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transmission line reflection reference</title>
  <desc id="desc">A vector network analyzer drives a transmission line with characteristic impedance Z0 and a termination ZL, showing incident and reflected waves, reflection coefficient, VSWR, and return loss.</desc>
  <rect width="1200" height="720" fill="#f7fbfd"/>
  <rect x="34" y="30" width="1132" height="82" rx="8" fill="#123d50"/>
  <text x="68" y="70" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Transmission Line Reflections</text>
  <text x="68" y="94" fill="#bfe0ec" font-family="Inter,Arial,sans-serif" font-size="16">Impedance matching, standing waves, and vector measurement</text>

  <g transform="translate(58 162)">
    <rect width="250" height="300" rx="10" fill="#d9e7ec" stroke="#173f50" stroke-width="4"/>
    <rect x="18" y="18" width="214" height="44" rx="5" fill="#f4f9fb" stroke="#91aab5" stroke-width="2"/>
    <text x="125" y="46" text-anchor="middle" fill="#17384a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">VECTOR NETWORK ANALYZER</text>
    <rect x="28" y="86" width="194" height="126" rx="6" fill="#102f3b" stroke="#071b23" stroke-width="4"/>
    <circle cx="91" cy="149" r="48" fill="none" stroke="#4c927f" stroke-width="2"/>
    <circle cx="91" cy="149" r="24" fill="none" stroke="#4c927f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M43 149H139M91 101V197" fill="none" stroke="#4c927f" stroke-width="1.5"/>
    <path d="M91 149L126 124" fill="none" stroke="#f2c84b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="126" cy="124" r="6" fill="#f2c84b"/>
    <text x="157" y="121" fill="#9adcc8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">S11</text>
    <text x="157" y="143" fill="#ffffff" font-family="Consolas,monospace" font-size="15" font-weight="700">|Γ| ∠φ</text>
    <text x="157" y="174" fill="#9adcc8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">RETURN</text>
    <text x="157" y="195" fill="#ffffff" font-family="Consolas,monospace" font-size="15" font-weight="700">LOSS</text>
    <circle cx="200" cy="256" r="22" fill="#aab9bf" stroke="#17384a" stroke-width="4"/>
    <circle cx="200" cy="256" r="10" fill="#1e313a" stroke="#d6a637" stroke-width="3"/>
    <text x="163" y="292" fill="#4f6c78" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">PORT 1</text>
  </g>

  <path d="M258 418C344 418 324 342 388 342" fill="none" stroke="#263f4a" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(364 224)">
    <text x="250" y="-18" text-anchor="middle" fill="#17384a" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Z0 = 50 Ω COAXIAL LINE</text>
    <rect width="500" height="236" rx="18" fill="#25373f" stroke="#102630" stroke-width="4"/>
    <rect x="18" y="20" width="464" height="196" rx="12" fill="#a6b6bc" stroke="#e2ecee" stroke-width="3" stroke-dasharray="6 5"/>
    <rect x="34" y="38" width="432" height="160" rx="9" fill="#f3f7f7" stroke="#748c96" stroke-width="3"/>
    <line x1="18" y1="118" x2="490" y2="118" stroke="#c47b1c" stroke-width="8"/>
    <circle cx="10" cy="118" r="18" fill="#aab9be" stroke="#17384a" stroke-width="4"/>
    <circle cx="10" cy="118" r="7" fill="#d58b27"/>
    <text x="58" y="63" fill="#9a6200" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">INCIDENT WAVE</text>
    <path d="M72 88C102 62 132 62 162 88S222 114 252 88S312 62 342 88S402 114 432 88" fill="none" stroke="#d99a19" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 118H308" fill="none" stroke="#b97808" stroke-width="3" marker-end="url(#arrowIncident)"/>
    <path d="M404 140H192" fill="none" stroke="#087da8" stroke-width="3" marker-end="url(#arrowReflected)"/>
    <path d="M432 169C402 143 372 143 342 169S282 195 252 169S192 143 162 169S102 195 72 169" fill="none" stroke="#168eb5" stroke-width="5" stroke-linecap="round"/>
    <text x="306" y="205" fill="#087da8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">REFLECTED WAVE</text>
  </g>

  <defs>
    <marker id="arrowIncident" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b97808"/>
    </marker>
    <marker id="arrowReflected" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#087da8"/>
    </marker>
  </defs>

  <g transform="translate(850 250)">
    <rect width="292" height="184" rx="10" fill="#d7e2e6" stroke="#173f50" stroke-width="4"/>
    <rect x="14" y="14" width="264" height="156" rx="7" fill="#f8fbfc" stroke="#ffffff" stroke-width="2"/>
    <rect x="-16" y="68" width="34" height="48" rx="6" fill="#9babb0" stroke="#17384a" stroke-width="4"/>
    <line x1="55" y1="48" x2="55" y2="136" stroke="#667d87" stroke-width="6"/>
    <line x1="74" y1="48" x2="74" y2="136" stroke="#667d87" stroke-width="6"/>
    <line x1="93" y1="48" x2="93" y2="136" stroke="#667d87" stroke-width="6"/>
    <text x="184" y="58" text-anchor="middle" fill="#54707a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">TERMINATION</text>
    <text x="184" y="100" text-anchor="middle" fill="#17384a" font-family="Consolas,monospace" font-size="32" font-weight="800">ZL</text>
    <text x="184" y="132" text-anchor="middle" fill="#0b8266" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">MATCH WHEN ZL = Z0</text>
  </g>

  <g transform="translate(58 508)">
    <rect width="1084" height="168" rx="10" fill="#ffffff" stroke="#bdd4de" stroke-width="3"/>
    <line x1="361" y1="22" x2="361" y2="146" stroke="#d3e2e8" stroke-width="2"/>
    <line x1="722" y1="22" x2="722" y2="146" stroke="#d3e2e8" stroke-width="2"/>

    <text x="28" y="48" fill="#55717d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">REFLECTION COEFFICIENT</text>
    <text x="28" y="84" fill="#17384a" font-family="Georgia,serif" font-size="22" font-weight="700">Γ = (ZL − Z0) / (ZL + Z0)</text>
    <text x="28" y="119" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">Γ = 0 is matched.</text>
    <text x="28" y="142" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">|Γ| → 1 is a severe mismatch.</text>

    <text x="389" y="48" fill="#55717d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">STANDING-WAVE RATIO</text>
    <text x="389" y="84" fill="#17384a" font-family="Georgia,serif" font-size="19" font-weight="700">VSWR = (1 + |Γ|) / (1 − |Γ|)</text>
    <text x="389" y="119" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">1.00:1 is ideal.</text>
    <text x="389" y="142" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">Lower VSWR means less reflection.</text>

    <text x="750" y="48" fill="#55717d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">RETURN LOSS</text>
    <text x="750" y="84" fill="#17384a" font-family="Georgia,serif" font-size="22" font-weight="700">RL = −20 log10 |Γ|</text>
    <text x="750" y="119" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">Higher return loss means</text>
    <text x="750" y="142" fill="#607886" font-family="Inter,Arial,sans-serif" font-size="14">less reflected energy.</text>
  </g>
</svg>
