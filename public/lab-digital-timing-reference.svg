<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous digital timing reference</title>
  <desc id="desc">A register-to-register timing path and timing diagram showing clock period, propagation delay, setup time, and positive setup margin.</desc>
  <rect width="1280" height="720" fill="#f5fafc"/>
  <rect x="38" y="34" width="1204" height="84" rx="8" fill="#123f51"/>
  <text x="76" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">SYNCHRONOUS DIGITAL TIMING</text>
  <text x="76" y="99" fill="#bce8f4" font-family="Arial, sans-serif" font-size="16">The data path must finish before the receiver setup window begins</text>

  <rect x="58" y="148" width="500" height="500" rx="8" fill="#ffffff" stroke="#b8d2dd" stroke-width="2"/>
  <text x="84" y="182" fill="#456777" font-family="Arial, sans-serif" font-size="15" font-weight="700">REGISTER-TO-REGISTER PATH</text>

  <rect x="90" y="248" width="140" height="156" rx="8" fill="#eaf4f8" stroke="#174b60" stroke-width="4"/>
  <path d="M145 248 A15 15 0 0 0 175 248" fill="none" stroke="#174b60" stroke-width="4"/>
  <text x="160" y="310" text-anchor="middle" fill="#14394a" font-family="Arial, sans-serif" font-size="24" font-weight="700">D FF</text>
  <text x="160" y="340" text-anchor="middle" fill="#557380" font-family="Arial, sans-serif" font-size="14">LAUNCH</text>
  <text x="103" y="380" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">CLK</text>
  <text x="208" y="286" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Q</text>

  <rect x="386" y="248" width="140" height="156" rx="8" fill="#eaf4f8" stroke="#174b60" stroke-width="4"/>
  <path d="M441 248 A15 15 0 0 0 471 248" fill="none" stroke="#174b60" stroke-width="4"/>
  <text x="456" y="310" text-anchor="middle" fill="#14394a" font-family="Arial, sans-serif" font-size="24" font-weight="700">D FF</text>
  <text x="456" y="340" text-anchor="middle" fill="#557380" font-family="Arial, sans-serif" font-size="14">CAPTURE</text>
  <text x="396" y="286" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">D</text>
  <text x="400" y="380" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">CLK</text>

  <path d="M230 280 H386" fill="none" stroke="#167fa8" stroke-width="5"/>
  <path d="M264 270 L286 280 L264 290" fill="none" stroke="#167fa8" stroke-width="4"/>
  <text x="308" y="258" text-anchor="middle" fill="#167fa8" font-family="Arial, sans-serif" font-size="15" font-weight="700">DATA PATH</text>
  <text x="308" y="316" text-anchor="middle" fill="#476877" font-family="Arial, sans-serif" font-size="14">tPD</text>

  <path d="M112 474 H474 M160 404 V474 M456 404 V474" fill="none" stroke="#174b60" stroke-width="4"/>
  <circle cx="112" cy="474" r="7" fill="#20ad82"/>
  <text x="84" y="480" text-anchor="end" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">CLOCK</text>
  <text x="308" y="510" text-anchor="middle" fill="#476877" font-family="Arial, sans-serif" font-size="14">Common clock domain</text>

  <rect x="84" y="548" width="448" height="70" rx="7" fill="#e3f7f1" stroke="#4eae91" stroke-width="2"/>
  <text x="106" y="578" fill="#1b5747" font-family="Arial, sans-serif" font-size="16" font-weight="700">SETUP CHECK</text>
  <text x="106" y="603" fill="#14394a" font-family="Arial, sans-serif" font-size="20" font-weight="700">tmargin = TCLK - tPD - tSU</text>

  <rect x="582" y="148" width="640" height="500" rx="8" fill="#ffffff" stroke="#b8d2dd" stroke-width="2"/>
  <text x="608" y="182" fill="#456777" font-family="Arial, sans-serif" font-size="15" font-weight="700">TIMING DIAGRAM</text>

  <g fill="none" stroke-linejoin="round" stroke-linecap="square">
    <path d="M682 250 H730 V214 H790 V250 H850 V214 H910 V250 H970 V214 H1030 V250 H1090" stroke="#f0b83f" stroke-width="5"/>
    <path d="M682 354 H756 V318 H882 V354 H1012 V318 H1090" stroke="#2ca9d3" stroke-width="5"/>
    <path d="M682 458 H798 V422 H924 V458 H1054 V422 H1090" stroke="#20ad82" stroke-width="5"/>
  </g>
  <g fill="#14394a" font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <text x="610" y="238">CLK</text>
    <text x="610" y="342">D</text>
    <text x="610" y="446">Q</text>
  </g>

  <line x1="730" y1="200" x2="730" y2="500" stroke="#6f8d99" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="850" y1="200" x2="850" y2="500" stroke="#6f8d99" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M730 196 V184 H850 V196" fill="none" stroke="#14394a" stroke-width="2"/>
  <text x="790" y="174" text-anchor="middle" fill="#14394a" font-family="Arial, sans-serif" font-size="14" font-weight="700">TCLK</text>

  <path d="M730 494 V514 H798 V494" fill="none" stroke="#20ad82" stroke-width="2"/>
  <text x="764" y="538" text-anchor="middle" fill="#14745a" font-family="Arial, sans-serif" font-size="14" font-weight="700">tPD</text>

  <rect x="826" y="294" width="24" height="184" fill="#ffe8b8" opacity="0.85"/>
  <path d="M826 494 V514 H850 V494" fill="none" stroke="#b66b09" stroke-width="2"/>
  <text x="838" y="538" text-anchor="middle" fill="#9d5b06" font-family="Arial, sans-serif" font-size="14" font-weight="700">tSU</text>

  <path d="M798 568 V588 H826 V568" fill="none" stroke="#167fa8" stroke-width="2"/>
  <text x="812" y="614" text-anchor="middle" fill="#167fa8" font-family="Arial, sans-serif" font-size="14" font-weight="700">POSITIVE MARGIN</text>

  <rect x="608" y="548" width="584" height="70" rx="7" fill="#edf7fb" stroke="#8fc6da" stroke-width="2"/>
  <text x="630" y="578" fill="#14394a" font-family="Arial, sans-serif" font-size="15" font-weight="700">PASS CONDITION</text>
  <text x="630" y="603" fill="#476877" font-family="Arial, sans-serif" font-size="15">Data is stable for at least tSU before the active capture edge.</text>
</svg>
