<text x="48" y="80" font-family="Inter, Arial, sans-serif" font-size="13" fill="#D6EEF2">IMG-0151 | Signals and Systems | EE-3001</text>
<line class="thin" x1="150" y1="300" x2="820" y2="300"/><line class="thin" x1="180" y1="190" x2="180" y2="420"/>
    <polyline class="accent" points="180,300.0 230,230.7 280,230.7 330,300.0 380,369.3 430,369.3 480,300.0 530,230.7 580,230.7 630,300.0 680,369.3 730,369.3 780,300.0"/>
