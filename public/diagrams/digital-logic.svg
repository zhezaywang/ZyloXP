<line class="wire" x1="480" y1="300" x2="480" y2="300.0"/>
<line class="wire" x1="530" y1="300" x2="530" y2="230.7"/>
<line class="wire" x1="580" y1="300" x2="580" y2="230.7"/>
<line class="wire" x1="630" y1="300" x2="630" y2="300.0"/>
<line class="wire" x1="680" y1="300" x2="680" y2="369.3"/>
<line class="wire" x1="730" y1="300" x2="730" y2="369.3"/>
<line class="wire" x1="780" y1="300" x2="780" y2="300.0"/>
