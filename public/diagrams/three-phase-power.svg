<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#174A5B"/>
    </marker>
    <style>
      .wire{stroke:#174A5B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#44606B;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .accent{stroke:#D97706;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#EAF4F4;stroke:#246B7A;stroke-width:3;rx:10}
      .label{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#1F2933}
      .small{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#52616B}
    </style>
  </defs>
<title id="title">Three-phase real power reference diagram</title>
<desc id="desc">A balanced three-phase load has line voltage 4 kV, line current 5 A, and power factor 0.75. What real power is delivered?</desc>
<rect x="0" y="0" width="960" height="600" fill="#F8FAFB"/>
<rect x="24" y="22" width="912" height="72" rx="10" fill="#174A5B"/>
<text x="48" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Three-phase real power reference diagram</text>
<text x="48" y="80" font-family="Inter, Arial, sans-serif" font-size="13" fill="#D6EEF2">IMG-0076 | Power Systems | EE-1501</text>
<circle cx="220" cy="300" r="52" fill="#FFFFFF" stroke="#246B7A" stroke-width="4"/>
    <text class="label" x="198" y="305">3ph</text>
    <line class="wire" x1="272" y1="270" x2="700" y2="220"/>
    <line class="wire" x1="272" y1="300" x2="700" y2="300"/>
    <line class="wire" x1="272" y1="330" x2="700" y2="380"/>
    <rect class="box" x="700" y="190" width="120" height="220"/>
    <text class="label" x="734" y="305">Load</text>
    <text class="label" x="360" y="450">P = sqrt(3) V_LL I_L pf</text>
<rect x="24" y="500" width="912" height="74" rx="10" fill="#FFFFFF" stroke="#D9E2E7"/>
<text x="48" y="528" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1F2933">A balanced three-phase load has line voltage 4 kV, line current 5 A, and power factor 0.75. What real</text>
<text x="48" y="550" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1F2933">power is delivered?</text>
</svg>